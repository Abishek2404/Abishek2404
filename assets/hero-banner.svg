<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
<title id="title">Abishek R — Cyberpunk Developer</title>
<desc id="desc">Anime-inspired cyberpunk banner with neon cyan and purple accents, city skyline, and developer tagline.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070711"/><stop offset=".55" stop-color="#10132B"/><stop offset="1" stop-color="#241039"/></linearGradient>
  <linearGradient id="neon"><stop stop-color="#00E5FF"/><stop offset="1" stop-color="#C04DFF"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#252B4A" stroke-width="1"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="320" rx="18" fill="url(#bg)"/>
<rect width="1200" height="320" rx="18" fill="url(#grid)" opacity=".7"/>
<g fill="#15172E" stroke="#00E5FF" stroke-opacity=".55">
  <path d="M0 260V165H48V125H82V260ZM92 260V205H132V105H174V260ZM180 260V170H225V140H265V260ZM900 260V175H945V135H985V260ZM995 260V110H1037V75H1080V260ZM1090 260V190H1135V145H1200V260Z"/>
</g>
<g fill="#00E5FF" opacity=".75"><path d="M58 145h7v11h-7zm53 75h7v9h-7zm35-93h7v11h-7zm776 68h7v11h-7zm92-80h7v11h-7zm95 47h7v11h-7z"/></g>
<rect x="28" y="26" width="1144" height="268" rx="10" fill="none" stroke="url(#neon)" stroke-width="2"/>
<g font-family="monospace" letter-spacing="3" fill="#00E5FF"><text x="58" y="60" font-size="14">// ABISHEK2404 : DEVELOPER PROFILE</text><text x="60" y="270" font-size="13">BUILD  /  LEARN  /  AUTOMATE  /  IMPROVE</text></g>
<text x="58" y="145" font-family="Arial,Helvetica,sans-serif" font-size="60" font-weight="800" fill="#F4F4FF">ABISHEK <tspan fill="#00E5FF">R</tspan></text>
<text x="62" y="188" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#D6D8E5">Full-Stack Developer · AI &amp; Automation Builder</text>
<text x="62" y="222" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#C9C9E0">Turning ideas into useful software, one commit at a time.</text>
<g transform="translate(1040 70)" filter="url(#glow)">
  <circle r="29" fill="none" stroke="#C04DFF" stroke-width="2"><animate attributeName="r" values="25;31;25" dur="3s" repeatCount="indefinite"/></circle>
  <circle r="17" fill="none" stroke="#00E5FF" stroke-width="2"/>
  <path d="M-10 0H10M0-10V10" stroke="#00E5FF" stroke-width="2"/>
</g>
<path d="M0 0H1200" stroke="#00E5FF" stroke-width="2" opacity=".6"><animate attributeName="d" values="M0 0H1200;M0 320H1200;M0 0H1200" dur="7s" repeatCount="indefinite"/></path>
</svg>